# Baked into every install and into the macOS bundle identifier, so it cannot be
# changed later without breaking upgrades and the keychain entries of anyone who
# already installed the app. This is the real one.
appId: app.robindoris.navinator
productName: Navinator
copyright: Copyright © 2026 Robindoris

directories:
  output: release
  buildResources: resources

files:
  # Allowlist, not a denylist. Anything added to the repo root later is a
  # release-day surprise otherwise — docs screenshots and agent tooling dirs
  # were both shipped inside every user's install before this was tightened.
  - out/**/*
  - package.json
  # The compiled renderer needs no source maps at runtime.
  - '!out/**/*.map'
  # electron-builder always force-adds production `node_modules`, which is only
  # `electron-updater` + `subsonic-api` since the renderer deps moved to
  # devDependencies. Everything else there is docs, tests and type defs.
  - '!node_modules/**/{test,__tests__,tests,example,examples,benchmark,benchmarks,docs,doc}/**'
  - '!node_modules/**/*.{md,markdown,ts,tsx,mts,cts,flow,map}'
  # Never ship repo-level sources, docs, or build metadata.
  - '!{src,scripts,docs,resources,.a0proj,.github,.vscode,.idea,.qodo}/**'
  - '!*.tsbuildinfo'
  - '!{README,AGENTS,RELEASING,LICENSE,screenshot.ps1,eslint.config.js}'
  - '!electron.vite.config.ts'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

win:
  icon: resources/icon.png
  executableName: Navinator
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # The queue, saved servers and settings live in userData, and throwing them
  # away on uninstall is hostile to a music library app.
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}

mac:
  category: public.app-category.music
  icon: resources/icon.png
  target:
    # dmg is what a human downloads; zip is what Squirrel.Mac actually applies
    # an update from. Dropping the zip silently breaks auto-update on macOS.
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSDocumentsFolderUsageDescription: Navinator needs access to your music folder to play local files.
    NSMicrophoneUsageDescription: Navinator does not record audio.

linux:
  category: AudioVideo
  icon: resources/icon.png
  synopsis: A modern desktop client for Navidrome
  description: >-
    A native-feeling desktop client for Navidrome with gapless playback,
    selective transcoding and synced lyrics. Talks only to your own server.
  target:
    # AppImage is the only Linux target electron-updater can self-update from.
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  maintainer: Robindoris
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  - provider: github
    owner: Robindoris
    repo: navinator
